spring:
  datasource:
    url: jdbc:h2:file:./data/authcore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

management:
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    persist-authorization: true
    doc-expansion: list
    filter: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    custom-css: /swagger-custom.css
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

authcore:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
  app:
    base-url: http://localhost:8080
